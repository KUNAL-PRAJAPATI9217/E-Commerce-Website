<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewpport"content="width=device-width,initial-scale=1.0">
        <title>Contact Us</title>
        <link rel="stylesheet"href="style.CSS">
    </head>
    <body>
        <h1 style="font-size: 40px;">Contact Us</h1>
        <form>
            <label for="name">Name:</label><br>
            <input type="text"id="name"name="name"placeholder="Enter Your Name"required>
            <br><br>

             <label for="email">Email:</label><br>
            <input type="email"id="email"name="email"placeholder="Enter Your email"required>
            <br><br>

             <label for="phone">phone Number:</label><br>
            <input type="tel"id="phone"name="phone"placeholder="Enter Your phone number"required>
            <br><br>

             <label for="message">message:</label><br>
            <textarea id="message"name="message"rows="6"cols="40"placeholder="Write your message here..."required></textarea>
            <br><br>

            <input type="submit"value="Send Message">
            <input type="reset"value="Clear">
        </form>
    </body>
</html>
